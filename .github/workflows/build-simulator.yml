name: build-simulator

# Compiles every app in apps/ for the iOS Simulator, without signing, then
# launches it on a simulator with SYNTHETIC data (`-demo`) and saves a
# screenshot of every screen, light and dark, as an artifact.

on:
  push:
    branches-ignore: ["ci-screenshots"]
    paths-ignore: ["**.md", "docs/**"]
  pull_request:
    paths-ignore: ["**.md", "docs/**"]
  workflow_dispatch:

env:
  XCODE_VERSION: "26.6"   # pinned; see CLAUDE.md "Xcode e runner"

concurrency:
  group: build-simulator-${{ github.ref }}
  cancel-in-progress: true

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      apps: ${{ steps.list.outputs.apps }}
    steps:
      - uses: actions/checkout@v4
      - id: list
        run: |
          apps=$(ls -d apps/*/ | xargs -n1 basename | jq -R . | jq -cs .)
          echo "apps=$apps" >> "$GITHUB_OUTPUT"
          echo "Apps: $apps"

  build:
    needs: discover
    runs-on: macos-26
    timeout-minutes: 50
    permissions:
      contents: write   # only to force-push the screenshots to the `ci-screenshots` branch
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJson(needs.discover.outputs.apps) }}
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-xcode
        with:
          xcode-version: ${{ env.XCODE_VERSION }}
          app: ${{ matrix.app }}

      - name: Build for iOS Simulator
        working-directory: apps/${{ matrix.app }}
        run: |
          set -euo pipefail
          mkdir -p build
          xcodebuild build \
            -project "${{ matrix.app }}.xcodeproj" \
            -scheme "${{ matrix.app }}" \
            -configuration Debug \
            -destination "generic/platform=iOS Simulator" \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            | tee build/xcodebuild-simulator.log | xcbeautify --renderer github-actions

      - name: Screenshots on the simulator (synthetic data)
        working-directory: apps/${{ matrix.app }}
        run: |
          set -euo pipefail
          SCREENS_FILE="screenshots.txt"
          if [ ! -f "$SCREENS_FILE" ]; then echo "No $SCREENS_FILE: skipping screenshots"; exit 0; fi
          APP_PATH=$(find build/DerivedData/Build/Products/Debug-iphonesimulator -maxdepth 1 -name "*.app" | head -1)
          BUNDLE_ID=$(/usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$APP_PATH/Info.plist")
          DEVICE=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          data = json.load(sys.stdin)["devices"]
          ios = sorted([k for k in data if "iOS" in k], reverse=True)
          for prefs in (["iPhone 17 Pro"], ["iPhone 16 Pro"], ["iPhone"]):
              for rt in ios:
                  for d in data[rt]:
                      if any(d["name"] == p or (p == "iPhone" and d["name"].startswith(p)) for p in prefs):
                          print(d["udid"]); sys.exit(0)
          sys.exit(1)
          ')
          echo "Simulator: $DEVICE ($BUNDLE_ID)"
          xcrun simctl boot "$DEVICE" || true
          xcrun simctl bootstatus "$DEVICE" -b
          xcrun simctl status_bar "$DEVICE" override --time "9:41" --dataNetwork wifi --wifiBars 3 \
            --cellularMode active --cellularBars 4 --batteryState charged --batteryLevel 100 || true
          xcrun simctl install "$DEVICE" "$APP_PATH"
          mkdir -p screenshots
          # Warm-up: let first-boot system banners pass, then a first (slower) launch.
          sleep 25
          xcrun simctl launch "$DEVICE" "$BUNDLE_ID" -demo -screen record </dev/null || true
          sleep 10
          for appearance in light dark; do
            xcrun simctl ui "$DEVICE" appearance "$appearance"
            while read -r screen wait; do
              [ -z "$screen" ] && continue
              xcrun simctl terminate "$DEVICE" "$BUNDLE_ID" </dev/null 2>/dev/null || true
              sleep 1
              xcrun simctl launch "$DEVICE" "$BUNDLE_ID" -demo -screen "$screen" \
                -AppleLanguages "(it)" -AppleLocale it_IT </dev/null
              sleep "${wait:-4}"
              xcrun simctl io "$DEVICE" screenshot "screenshots/${appearance}-${screen}.png" </dev/null
              echo "saved ${appearance}-${screen}.png"
            done < "$SCREENS_FILE"
          done
          ls -la screenshots

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-${{ matrix.app }}
          path: apps/${{ matrix.app }}/screenshots/*.png
          if-no-files-found: ignore
          retention-days: 14

      - name: Publish screenshots to branch ci-screenshots
        if: github.event_name == 'push'
        continue-on-error: true
        working-directory: apps/${{ matrix.app }}
        env:
          TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ls screenshots/*.png >/dev/null 2>&1 || { echo "no screenshots"; exit 0; }
          out=$(mktemp -d)
          mkdir -p "$out/${{ matrix.app }}"
          for f in screenshots/*.png; do
            sips -Z 1100 "$f" --out "$out/${{ matrix.app }}/$(basename "$f")" >/dev/null
          done
          cd "$out"
          {
            echo "# Screenshot ${{ matrix.app }}"
            echo
            echo "Dati sintetici. Commit \`${GITHUB_SHA::7}\` del branch \`${GITHUB_REF_NAME}\`."
            echo
            for f in ${{ matrix.app }}/*.png; do echo "![$(basename "$f" .png)]($f)"; done
          } > README.md
          git init -q -b ci-screenshots
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "Screenshot ${{ matrix.app }} @ ${GITHUB_SHA::7}"
          git push -qf "https://x-access-token:${TOKEN}@github.com/${{ github.repository }}.git" HEAD:ci-screenshots

      - name: Upload raw xcodebuild log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-simulator-log-${{ matrix.app }}
          path: apps/${{ matrix.app }}/build/xcodebuild-simulator.log
          if-no-files-found: ignore
          retention-days: 7
