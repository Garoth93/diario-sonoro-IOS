# XcodeGen spec. The .xcodeproj is generated in CI with `xcodegen generate`
# and is never committed.
#
name: DiarioSonoro

options:
  bundleIdPrefix: com.garoth93
  deploymentTarget:
    iOS: "26.0"   # iPhone dell'utente: iOS 26+; SDK del runner: iOS 26.5 (Xcode 26.6)
  xcodeVersion: "26.6"
  createIntermediateGroups: true
  generateEmptyDirectories: true

packages:
  SonoroCore:
    path: ../../packages/SonoroCore

settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "26.0"
    TARGETED_DEVICE_FAMILY: "1"          # iPhone only
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    # Signing is intentionally empty: CI builds pass CODE_SIGNING_ALLOWED=NO,
    # then ad-hoc signs with the .entitlements files (App Group) so that
    # Sideloadly / SideStore know the widget shares data with the app.
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: ""
    DEVELOPMENT_TEAM: ""
    PROVISIONING_PROFILE_SPECIFIER: ""
    ENABLE_USER_SCRIPT_SANDBOXING: YES

targets:
  DiarioSonoro:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Shared
      - path: Resources
    dependencies:
      - package: SonoroCore
        product: SonoroCore
      - target: DiarioSonoroWidgets
        embed: true
      - sdk: AVFoundation.framework
      - sdk: CoreLocation.framework
      - sdk: MapKit.framework
      - sdk: WeatherKit.framework
      - sdk: MediaPlayer.framework
      - sdk: LocalAuthentication.framework
      - sdk: BackgroundTasks.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.garoth93.diariosonoro
        PRODUCT_NAME: DiarioSonoro
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: DiarioSonoro.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    info:
      path: Info.plist   # generated by XcodeGen from the properties below (git-ignored)
      properties:
        CFBundleDisplayName: Diario Sonoro
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDevelopmentRegion: it
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIApplicationSupportsIndirectInputEvents: true
        ITSAppUsesNonExemptEncryption: false
        LSRequiresIPhoneOS: true
        NSMicrophoneUsageDescription: "Diario Sonoro usa il microfono solo mentre tieni premuto il pulsante, per registrare qualche secondo del suono intorno a te. L'audio resta sul tuo iPhone."
        NSLocationWhenInUseUsageDescription: "Diario Sonoro chiede la posizione una sola volta, al momento della registrazione, per ricordare dove hai registrato. Nessun tracciamento continuo e nulla lascia il tuo iPhone."
        NSFaceIDUsageDescription: "Face ID protegge l'accesso al tuo diario sonoro."
        UIBackgroundModes:
          - audio
          - fetch
        BGTaskSchedulerPermittedIdentifiers:
          - com.garoth93.diariosonoro.soundtrack
        DSAppGroup: group.com.garoth93.diariosonoro
        CFBundleURLTypes:
          - CFBundleURLName: com.garoth93.diariosonoro
            CFBundleURLSchemes:
              - diariosonoro

  DiarioSonoroWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: Widgets
      - path: Shared
    dependencies:
      - package: SonoroCore
        product: SonoroCore
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.garoth93.diariosonoro.widgets
        PRODUCT_NAME: DiarioSonoroWidgets
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: Widgets.entitlements
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) WIDGET_EXTENSION"
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
    info:
      path: Widgets-Info.plist   # generated by XcodeGen (git-ignored)
      properties:
        CFBundleDisplayName: Diario Sonoro
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDevelopmentRegion: it
        DSAppGroup: group.com.garoth93.diariosonoro
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension

schemes:
  DiarioSonoro:
    build:
      targets:
        DiarioSonoro: all
        DiarioSonoroWidgets: all
    run:
      config: Debug
    archive:
      config: Release
